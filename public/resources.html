<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:site_name" content="NetHub Campus Wiki" />
  <meta property="og:title" content="资源中心 - NetHub Campus Wiki" />
  <meta property="og:image" content="/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>资源中心</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/nethub-favicon-32.png?v=3" />
  <link rel="stylesheet" href="/css/styles.css?v=project-logo1" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand site-brand" href="/index.html" aria-label="NetHub Campus Wiki 首页">
        <img class="site-logo" src="/assets/nethub-icon.png?v=3" alt="" />
        <span class="brand-copy">
          <strong>NetHub</strong>
          <small>Campus Wiki</small>
        </span>
      </a>
      <div class="nav-links" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a href="/projects.html">CAS 项目库</a>
        <a class="active" href="/resources.html" aria-current="page">资源中心</a>
        <a class="teacher-nav-link" href="/resources.html?category=teacher">老师驾到<span class="nav-new-badge">new</span></a>
        <a href="/about.html">关于我们</a>
      </div>
    </nav>
  </header>

  <section class="container resource-filter-bar" aria-label="资源搜索与筛选">
    <div class="card project-search-card">
      <label class="project-search-field" for="resourceSearch">
        <img src="/assets/icons/heroicons/magnifying-glass.svg" alt="" aria-hidden="true" />
        <span class="sr-only">搜索资源</span>
        <input id="resourceSearch" type="search" autocomplete="off" />
      </label>
      <button
        id="resourceFilterToggle"
        class="project-filter-toggle"
        type="button"
        aria-label="显示详细筛选"
        aria-expanded="false"
        aria-controls="resourceAdvancedFilters"
      >
        <img src="/assets/icons/heroicons/funnel.svg" alt="" aria-hidden="true" />
        <span id="resourceFilterCount" class="project-filter-count" hidden></span>
      </button>
    </div>

    <div id="resourceAdvancedFilters" class="card project-advanced-filters project-filter-options-only" role="region" aria-label="详细筛选" hidden>
      <div class="project-filter-controls">
        <label for="resourceYear">
          <span>年份</span>
          <select id="resourceYear" class="input">
            <option value="">全部年份</option>
          </select>
        </label>

        <label for="resourceSort">
          <span>排序</span>
          <select id="resourceSort" class="input">
            <option value="hot">最热</option>
            <option value="new">最新</option>
            <option value="download">下载最多</option>
            <option value="old">最早</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <main class="container library-layout resource-library-layout">
    <aside class="card sidebar resource-sidebar filter-category-sidebar">
      <div class="filter-sidebar-title">
        <h2>资源类型</h2>
        <button id="clearResourceFilters" type="button">清除</button>
      </div>
      <div id="resourceCategoryList" class="category-list"></div>
    </aside>

    <section class="card content-panel resource-panel">
      <div id="resourceView">
        <div class="section-title">
          <div>
            <h1>资源中心</h1>
            <span id="resourceCount">加载中...</span>
          </div>
        </div>
        <div id="resourceGrid" class="resource-grid"></div>
      </div>

      <div id="photoView" class="photo-view">
        <div class="section-title with-control">
          <div>
            <h1 id="photoTitle">活动照片</h1>
            <span id="photoMeta">正在加载活动...</span>
          </div>
          <button id="downloadActivity" class="button secondary" type="button">下载压缩文件</button>
        </div>
        <div id="photoGrid" class="photo-grid" aria-live="polite"></div>
      </div>

      <div id="yearbookView" class="yearbook-view">
        <div class="section-title with-control">
          <div>
            <h1 id="yearbookTitle">Yearbook</h1>
            <span id="yearbookMeta">正在加载 Yearbook...</span>
          </div>
          <div class="yearbook-actions">
            <button id="backToResources" class="button secondary" type="button">返回资源列表</button>
            <a id="downloadYearbook" class="button secondary" href="#" download>下载 PDF</a>
          </div>
        </div>
        <div class="yearbook-reader" aria-live="polite">
          <button id="yearbookPrev" class="yearbook-nav prev" type="button" aria-label="上一组页面">‹</button>
          <div id="yearbookPages" class="yearbook-pages"></div>
          <button id="yearbookNext" class="yearbook-nav next" type="button" aria-label="下一组页面">›</button>
        </div>
        <section id="yearbookComments" class="comments-section" aria-label="Yearbook 留言"></section>
      </div>
    </section>
  </main>

  <div id="photoModal" class="photo-modal" aria-hidden="true" role="dialog" aria-label="照片详情">
    <div class="photo-modal-backdrop" data-close-modal></div>
    <section class="photo-modal-panel">
      <div class="photo-modal-head">
        <div>
          <h2 id="modalTitle">照片详情</h2>
          <p id="modalMeta"></p>
        </div>
        <div class="modal-actions">
          <button id="modalDownload" class="button secondary" type="button">下载</button>
          <button class="icon-button" type="button" aria-label="关闭" data-close-modal>×</button>
        </div>
      </div>
      <div class="photo-modal-stage">
        <button id="modalPrev" class="photo-modal-nav prev" type="button" aria-label="上一张">‹</button>
        <img id="modalImage" src="" alt="" />
        <button id="modalNext" class="photo-modal-nav next" type="button" aria-label="下一张">›</button>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <a class="brand site-brand" href="/index.html" aria-label="NetHub Campus Wiki 首页">
        <img class="site-logo" src="/assets/nethub-icon.png?v=3" alt="" />
        <span class="brand-copy">
          <strong>NetHub</strong>
          <small>Campus Wiki</small>
        </span>
      </a>
      <nav class="site-footer-links" aria-label="页脚导航">
        <a href="/index.html">首页</a>
        <a href="/projects.html">CAS 项目库</a>
        <a href="/resources.html">资源中心</a>
        <a href="/about.html">关于我们</a>
      </nav>
      <p class="site-footer-copy">© 2026 NetHub Campus Wiki</p>
    </div>
  </footer>
  <script src="/js/config.js"></script>
  <script src="/js/api.js?v=project-logo1"></script>
  <script src="/js/comments.js?v=nethub-comments2"></script>
  <script src="/js/resource-ui.js?v=shared-resource-ui1"></script>
  <script src="/js/resources.js?v=shared-resource-ui1"></script>
</body>
</html>
