<head>
  <meta charset="UTF-8" />

  <meta property="og:title" content="个人中心 - NetHub Campus Wiki" />

  <script src="/__nethub/client.js?v=1" defer></script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <link rel="stylesheet" href="/css/ui-refresh.css?v=1" />
  <script src="/js/translations.js?v=ui-bilingual-1"></script>
  <script src="/js/translations-static.js?v=ui-bilingual-1"></script>
  <script src="/js/i18n.js?v=ui-bilingual-1"></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand site-brand" href="/index.html" aria-label="NetHub Campus Wiki 首页">
        <img class="site-logo" data-nethub-logo src="/assets/brand/nethub-mark.svg" alt="" />
        <span class="brand-copy"><strong>NetHub</strong><small>Campus Wiki</small></span>
      </a>
      <div class="nav-links" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a href="/projects.html">项目</a>
        <a href="/resources.html">资源</a>
        <a class="teacher-nav-link" href="/resources.html?category=teacher">老师驾到</a>
        <a href="/links.html">友链</a>
        <a href="/about.html">关于</a>
      </div>
    </nav>
  </header>

  <main class="container profile-layout">
    <section id="profileGate" class="card messages-gate is-hidden">
      <h1>登录后管理个人资料</h1>
      <a class="button" href="/index.html">返回首页登录</a>
    </section>
    <div id="profileApp" class="profile-grid is-hidden">
      <aside class="card profile-summary">
        <div id="profileAvatarPreview" class="profile-avatar"></div>
        <h1 id="profileTitle">个人中心</h1>
        <p id="profileHandle"></p>
        <a id="publicProfileLink" class="button secondary" href="#">查看公开主页</a>
      </aside>
      <div class="profile-content">
        <section class="card"><h2>账号状态与邀请</h2><div data-community-status></div></section>
        <section class="card"><h2>我的提交</h2><p>内容审核通过后公开。查看进度或撤回待审内容。</p><div data-my-submissions></div></section>
        <section class="card">
          <div class="section-title"><div><h2>个人资料</h2><span>公开展示给其他校园用户</span></div></div>
          <form id="profileForm" class="profile-form">
            <label>姓名或展示名<input class="input" name="displayName" maxlength="80" /></label>
            <div class="profile-avatar-actions">
              <a id="avatarAccountLink" class="button compact account-center-button" href="https://auth.nethub.wiki/account" target="_blank" rel="noopener noreferrer" role="button"><span>在账户中心修改头像</span><span aria-hidden="true">↗</span></a>
              <small>头像在 Accounts 更新后同步。</small>
            </div>
            <label>个人简介<textarea class="input" name="bio" maxlength="300" rows="5"></textarea></label>
            <label>谁可以给我发私信
              <select class="input" name="messagingPermission">
                <option value="everyone">所有用户（未建立联系者每日限发一条）</option>
                <option value="following">仅我关注的人</option>
                <option value="mutual">仅互相关注</option>
                <option value="nobody">不接收新私信</option>
              </select>
            </label>
            <div class="profile-form-actions">
              <span id="profileMessage" aria-live="polite"></span>
              <button class="button" type="submit">保存资料</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script>NetHubI18n.initialize();</script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js?v=ui-bilingual-1"></script>
  <script src="/js/profile.js?v=ui-bilingual-1"></script>
  <script src="/js/content-governance.js?v=ui-bilingual-1"></script>
</body>
</html>
