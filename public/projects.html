<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:site_name" content="NetHub Campus Wiki" />
  <meta property="og:title" content="CAS 项目库 - NetHub Campus Wiki" />
  <meta property="og:description" content="发现校园 CAS 项目与真实项目成员。" />
  <meta property="og:image" content="/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>项目</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
  <link rel="stylesheet" href="/css/styles.css?v=friend-links1" />
  <script src="/__nethub/client.js?v=1" defer></script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <link rel="stylesheet" href="/css/ui-refresh.css?v=1" />
  <script src="/js/translations.js?v=ui-bilingual-1"></script>
  <script src="/js/translations-static.js?v=ui-bilingual-1"></script>
  <script src="/js/i18n.js?v=ui-bilingual-1"></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand site-brand" href="/index.html" aria-label="NetHub Campus Wiki 首页">
        <img class="site-logo" data-nethub-logo src="/assets/brand/nethub-mark.svg" alt="" />
        <span class="brand-copy">
          <strong>NetHub</strong>
          <small>Campus Wiki</small>
        </span>
      </a>
      <div class="nav-links" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a class="active" href="/projects.html" aria-current="page">项目</a>
        <a href="/resources.html">资源</a>
        <a class="teacher-nav-link" href="/resources.html?category=teacher">老师驾到</a>
        <a href="/links.html">友链</a>
        <a href="/about.html">关于</a>
      </div>
    </nav>
  </header>

  <section class="container project-filter-bar" aria-label="项目搜索与筛选">
    <div class="card project-search-card">
      <label class="project-search-field" for="searchInput">
        <img src="/assets/icons/heroicons/magnifying-glass.svg" alt="" aria-hidden="true" />
        <span class="sr-only">搜索项目</span>
        <input id="searchInput" type="search" autocomplete="off" />
      </label>
      <button
        id="projectFilterToggle"
        class="project-filter-toggle"
        type="button"
        aria-label="显示详细筛选"
        aria-expanded="false"
        aria-controls="projectAdvancedFilters"
      >
        <img src="/assets/icons/heroicons/funnel.svg" alt="" aria-hidden="true" />
        <span id="projectFilterCount" class="project-filter-count" hidden></span>
      </button>
    </div>

    <div id="projectAdvancedFilters" class="card project-advanced-filters project-filter-options-only" role="region" aria-label="详细筛选" hidden>
      <div class="project-filter-controls">
        <label for="yearSelect">
          <span>年份</span>
          <select id="yearSelect" class="input">
            <option value="">全部年份</option>
          </select>
        </label>

        <label for="sortSelect">
          <span>排序</span>
          <select id="sortSelect" class="input">
            <option value="latest">最新发布</option>
            <option value="popular">最多浏览</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <main class="container library-layout project-library-layout">
    <aside class="card sidebar filter-category-sidebar">
      <div class="filter-sidebar-title">
        <h2>项目分类</h2>
        <button id="clearProjectFilters" type="button" aria-label="清除所有筛选">清除筛选</button>
      </div>
      <div id="categoryList" class="category-list"></div>
    </aside>

    <section class="card content-panel">
      <div class="section-title">
        <div>
          <h1>项目</h1>
          <span id="projectCount">加载中...</span>
        </div>
      </div>
      <div id="projectList" class="project-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <a class="brand site-brand" href="/index.html" aria-label="NetHub Campus Wiki 首页">
        <img class="site-logo" data-nethub-logo src="/assets/brand/nethub-mark.svg" alt="" />
        <span class="brand-copy">
          <strong>NetHub</strong>
          <small>Campus Wiki</small>
        </span>
      </a>
      <nav class="site-footer-links" aria-label="页脚导航">
        <a href="/index.html">首页</a>
        <a href="/projects.html">项目</a>
        <a href="/resources.html">资源</a>
        <a href="/about.html">关于</a>
      </nav>
      <p class="site-footer-copy">© 2026 NetHub Campus Wiki</p>
    </div>
  </footer>
  <script>NetHubI18n.initialize();</script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js?v=ui-bilingual-1"></script>
  <script src="/js/projects.js?v=ui-bilingual-1"></script>
</body>
</html>
