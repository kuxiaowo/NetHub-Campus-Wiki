name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Linux deployment scripts
        run: |
          bash -n scripts/init_linux_common.sh
          bash -n scripts/init_linux.sh
          bash -n scripts/init_backend_linux.sh
          bash -n scripts/init_frontend_linux.sh
